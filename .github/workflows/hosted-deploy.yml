name: Hosted Copilot deployment

on:
  workflow_call:

permissions:
  contents: read
  id-token: write

concurrency:
  group: hosted-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HOSTED_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: hosted-production
    timeout-minutes: 30
    env:
      HOSTED_RESOURCE_GROUP: ${{ vars.HOSTED_RESOURCE_GROUP }}
      HOSTED_CONTAINER_APP: ${{ vars.HOSTED_CONTAINER_APP }}
      HOSTED_ACR_NAME: ${{ vars.HOSTED_ACR_NAME }}
      AZURE_EXTENSION_USE_DYNAMIC_INSTALL: "no"
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.HOSTED_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.HOSTED_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.HOSTED_AZURE_SUBSCRIPTION_ID }}
      - name: Resolve and authenticate to the private registry
        run: |
          set -euo pipefail
          : "${HOSTED_RESOURCE_GROUP:?Missing HOSTED_RESOURCE_GROUP}"
          : "${HOSTED_CONTAINER_APP:?Missing HOSTED_CONTAINER_APP}"
          : "${HOSTED_ACR_NAME:?Missing HOSTED_ACR_NAME}"
          registry="$(az acr show --name "$HOSTED_ACR_NAME" --query loginServer --output tsv)"
          echo "HOSTED_REGISTRY=$registry" >> "$GITHUB_ENV"
          az acr login --name "$HOSTED_ACR_NAME" --output none
      - uses: docker/setup-buildx-action@v3
      - name: Build the immutable hosted image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hosted
          platforms: linux/amd64
          push: true
          tags: ${{ env.HOSTED_REGISTRY }}/openflowkit:${{ github.sha }}
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=hosted
          cache-to: type=gha,mode=max,scope=hosted
      - name: Verify the exact published image before staging
        env:
          HOSTED_IMAGE: ${{ env.HOSTED_REGISTRY }}/openflowkit@${{ steps.image.outputs.digest }}
        run: |
          docker run --rm --platform linux/amd64 --memory=2g --cpus=1 --pids-limit=128 \
            --env "HOSTED_EXPECTED_REVISION=$GITHUB_SHA" \
            --mount "type=bind,source=$PWD/scripts/hosted-runtime-smoke.mjs,target=/app/hosted-runtime-smoke.mjs,readonly" \
            --entrypoint node "$HOSTED_IMAGE" /app/hosted-runtime-smoke.mjs
      - name: Stage, verify, and promote
        env:
          HOSTED_IMAGE: ${{ env.HOSTED_REGISTRY }}/openflowkit@${{ steps.image.outputs.digest }}
        run: bash scripts/deploy-hosted.sh
