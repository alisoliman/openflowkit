name: Quality Checks

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI quality suite
        run: npm run test:ci

      - name: Build hosted server
        run: npm run build:server

      - name: Smoke-check the production server and bundled runtime without credentials
        run: npm run test:hosted-runtime

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke suite
        run: npm run e2e:ci

  hosted-container:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production Linux image without publishing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hosted
          platforms: linux/amd64
          load: true
          tags: openflowkit-hosted:ci
          build-args: APP_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=hosted
          cache-to: type=gha,mode=max,scope=hosted
      - name: Verify the container with production resource limits
        run: |
          docker run --rm --platform linux/amd64 --memory=2g --cpus=1 --pids-limit=128 \
            --env "HOSTED_EXPECTED_REVISION=$GITHUB_SHA" \
            --mount "type=bind,source=$PWD/scripts/hosted-runtime-smoke.mjs,target=/app/hosted-runtime-smoke.mjs,readonly" \
            --entrypoint node openflowkit-hosted:ci /app/hosted-runtime-smoke.mjs

  deploy-hosted:
    needs: [quality, hosted-container]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.HOSTED_DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/hosted-deploy.yml
